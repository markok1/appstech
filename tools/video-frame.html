<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Frame Probe</title>
  <style>
    html,
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
    }

    .label {
      left: 16px;
      position: fixed;
      top: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="label" id="label">Loading…</div>
  <video id="video" muted playsinline crossorigin="anonymous"></video>
  <canvas id="canvas"></canvas>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");
    const time = Number(params.get("t") || "0");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const label = document.getElementById("label");
    const context = canvas.getContext("2d");

    if (!src) {
      label.textContent = "Missing src query param";
      throw new Error("Missing src query param");
    }

    video.src = src;

    function drawFrame() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      label.textContent = `t=${time.toFixed(2)}s  ${canvas.width}x${canvas.height}`;
      document.title = `ready:${time.toFixed(2)}`;
      window.__frameReady = true;
    }

    video.addEventListener("loadedmetadata", () => {
      video.currentTime = Math.min(Math.max(time, 0), Math.max(video.duration - 0.05, 0));
    });

    video.addEventListener("seeked", drawFrame, { once: true });
    video.addEventListener("error", () => {
      label.textContent = "Video failed to load";
      document.title = "error";
    });
  </script>
</body>
</html>
